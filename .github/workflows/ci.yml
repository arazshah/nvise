name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nvise
          POSTGRES_USER: nvise
          POSTGRES_PASSWORD: nvise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nvise -d nvise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret
      DATABASE_URL: postgresql://nvise:nvise@127.0.0.1:5432/nvise
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Django checks
        run: python manage.py check
      - name: Generate processing migration preview
        run: |
          python manage.py makemigrations processing --noinput
          echo '--- PROCESSING MIGRATION ---'
          cat apps/processing/migrations/0001_initial.py
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
