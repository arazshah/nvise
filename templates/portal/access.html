<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ورود امن به نویسه</title>
  <style>
    body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:560px;margin:10vh auto;padding:24px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 16px 50px rgba(21,36,72,.08)}h1{margin-top:0}.btn{border:0;border-radius:12px;padding:12px 18px;background:#172033;color:#fff;cursor:pointer}.muted{color:#667085;line-height:1.9}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>ورود امن به پنل بررسی گزارش</h1>
  {% if token_row %}
    <p class="muted">این لینک برای پرونده <strong>{{ token_row.case.case_code }}</strong> صادر شده است. برای جلوگیری از مصرف خودکار لینک توسط preview پیام‌رسان، ورود فقط با دکمه زیر انجام می‌شود.</p>
    <form method="post">{% csrf_token %}<button class="btn" type="submit">ورود به پرونده</button></form>
  {% else %}
    <p class="muted">این لینک معتبر نیست یا دیگر در دسترس نیست.</p>
  {% endif %}
</div></div>
</body>
</html>
